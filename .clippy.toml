# LINEBENDER LINT SET - .clippy.toml - v1
# See https://linebender.org/wiki/canonical-lints/

# The default Clippy value is capped at 8 bytes, which was chosen to improve performance on 32-bit.
# Given that we are building for the future and even low-end mobile phones have 64-bit CPUs,
# it makes sense to optimize for 64-bit and accept the performance hits on 32-bit.
# 16 bytes is the number of bytes that fits into two 64-bit CPU registers.
trivial-copy-size-limit = 16

# END LINEBENDER LINT SET

# As in fearless_simd: no transmutes. plumb has none; for SIMD conversions use fearless_simd's own
# API (`split_*`/`combine_*`, `From` conversions to and from the arch types).
disallowed-methods = [
  { path = "core::mem::transmute", reason = "Use fearless_simd's split/combine and From conversions." },
  { path = "std::mem::transmute", reason = "Use fearless_simd's split/combine and From conversions." },
  { path = "core::mem::transmute_copy", reason = "Use fearless_simd's split/combine and From conversions." },
  { path = "std::mem::transmute_copy", reason = "Use fearless_simd's split/combine and From conversions." },
]
