[package]
name = "plumb_lines"
version = "0.1.0"
description = "Cache-line and memory-ordering operations for fearless_simd: aligned vector views, scoped non-temporal stores, CLFLUSHOPT and MOVDIR64B"
readme = "README.md"
keywords = ["simd", "non-temporal", "clflushopt", "movdir64b", "fearless_simd"]
categories = ["hardware-support", "no-std"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
fearless_simd = { workspace = true, default-features = false, features = ["libm"] }

[dev-dependencies]
fearless_simd = { workspace = true }
fearless_simd_macros.workspace = true

[features]
default = []
# Use the stdarch `_mm_clflushopt` intrinsic (unstable: `simd_x86_clflushopt` and
# `clflushopt_target_feature`, rust-lang/rust#157096) instead of `asm!`, and export the
# `with_clflushopt!` entry macro. Nightly only. Both paths emit the same instruction.
nightly = []
