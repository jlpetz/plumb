[package]
name = "plumb-bench"
version = "0.0.0"
publish = false
description = "Benchmarks, asm gate and equivalence tests for plumb_lines/plumb_tiles against TMR's current SIMD style"
edition.workspace = true
license.workspace = true

[dependencies]
fearless_simd.workspace = true
fearless_simd_macros.workspace = true
plumb_lines = { path = "../plumb_lines", features = ["nightly"] }
plumb_tiles = { path = "../plumb_tiles", features = ["nightly"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

# Not the workspace (Linebender) lint set: the bench reproduces TMR's kernels in TMR's own style,
# e.g. `unsafe fn` bodies without inner `unsafe` blocks, which that set forbids. The set applies
# to the library crates.
[lints.rust]
unsafe_op_in_unsafe_fn = "allow"

[lints.clippy]
# TMR's kernels convert between std::simd and arch types with `transmute`; the ports keep that.
disallowed_methods = "allow"
